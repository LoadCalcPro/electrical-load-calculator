    let wrapper = await response.text();

    source = source.replace("function calculate(){", String.raw\`
function applyMobileInputHints(){
  for(const r of DATA.inputRows){
    if(r===46) continue;
    const qtyEl=document.getElementById("q"+r);
    const vaEl=document.getElementById("v"+r);
    if(qtyEl && !qtyEl.readOnly){
      qtyEl.placeholder = r===5 ? "Square Footage" : "QTY";
      qtyEl.setAttribute("aria-label", r===5 ? "Square Footage" : "Quantity");
    }
    if(vaEl && !vaEl.readOnly){
      vaEl.placeholder = r===43 ? "Nameplate VA" : "VA";
      vaEl.setAttribute("aria-label", r===43 ? "Nameplate VA" : "VA Each");
    }
  }
}
function calculate(){
  applyMobileInputHints();\`);

    wrapper = wrapper.replace(marker, mobileUpgrade + "\n" + marker);
    document.open();
    document.write(wrapper);
    document.close();
  }catch(error){
    console.error(error);
    if(errorEl) errorEl.textContent = "The mobile staging calculator could not be opened. Please refresh the page.";
  }
})();
