<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Generator Mobile Staging</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif}
#calculatorFrame{display:block;width:100%;height:100%;border:0;background:#f3f4f6}
#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#1e3a8a,#0f172a);z-index:10}
#status.hidden{display:none}
.status-card{width:100%;max-width:430px;background:#fff;border:1px solid #d1d5db;border-radius:18px;padding:26px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.32)}
.status-card h1{margin:0 0 8px;color:#1e3a8a;font-size:24px}.status-card p{margin:0;color:#4b5563;line-height:1.45}
</style>
</head>
<body>
<div id="status"><div class="status-card"><h1>LoadCalcPro</h1><p>Opening Generator Optional Method Calculator…</p></div></div>
<iframe id="calculatorFrame" title="Generator Optional Method Calculator" src="generator-optional-method.html?v=mobile-staging-5"></iframe>
<script>
(function(){
  const frame=document.getElementById('calculatorFrame');
  const status=document.getElementById('status');
  let attempts=0;

  const mobileCSS=`
@media (max-width:760px){
  html,body{overflow-x:hidden!important;background:#eef3fb!important}
  main{padding:12px!important;overflow:visible!important}
  .form-titlebar{padding:2px 1px 0!important;margin-bottom:10px!important;gap:8px!important}
  .form-titlebar .form-title{font-size:15px!important;line-height:1.25!important}
  .form-titlebar .form-brand{font-size:11px!important}
  .project-info{padding:11px!important;gap:6px!important;margin-bottom:11px!important;border-radius:12px!important}
  .project-info label{font-size:12px!important}
  .project-info input{height:38px!important;font-size:15px!important;padding:7px 9px!important}
  .toolbar{gap:8px!important;margin-bottom:12px!important}
  .toolbar-left{width:100%!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important}
  .toolbar-left button{padding:9px 3px!important;font-size:11px!important;white-space:nowrap!important}
  .note{font-size:12px!important;line-height:1.4!important;padding:10px 12px!important;background:#ecfdf5!important;border:1px solid #6ee7a2!important;border-radius:12px!important;color:#14532d!important}
  .sheet-wrap{overflow:visible!important;max-height:none!important;background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important}
  table{display:block!important;min-width:0!important;width:100%!important;table-layout:auto!important}
  colgroup,thead{display:none!important}
  tbody{display:block!important;width:100%!important}
  tbody tr{box-sizing:border-box!important}
  .section{display:block!important;width:100%!important;margin:18px 0 10px!important;border-radius:10px!important;overflow:hidden!important;background:#244394!important}
  .section td{display:none!important}
  .section td:first-child{display:block!important;width:100%!important;height:auto!important;min-height:0!important;border:0!important;padding:11px 12px!important;background:#244394!important;color:#fff!important;text-align:center!important;font-size:18px!important;line-height:1.2!important;white-space:normal!important}
  #row46{display:grid!important;grid-template-columns:1fr 105px!important;align-items:center!important}
  #row46 td:first-child,#row46 td:nth-child(2){display:flex!important;min-height:48px!important;padding:8px 10px!important}
  #row46 td:nth-child(2){background:#fff!important}
  tbody tr:not(.section):not(.subtotal):not(.total):not(.after-min-amp-spacer){display:grid!important;grid-template-columns:1fr 1fr!important;width:100%!important;margin:0 0 12px!important;background:#fff!important;border:1px solid #aeb9c8!important;border-radius:13px!important;overflow:hidden!important;box-shadow:0 1px 2px rgba(15,23,42,.04)!important}
  tbody tr:not(.section):not(.subtotal):not(.total):not(.after-min-amp-spacer) td{display:flex!important;align-items:center!important;min-width:0!important;height:auto!important;border:0!important;padding:10px!important;font-size:14px!important;background:#fff!important}
  tbody tr:not(.section):not(.subtotal):not(.total):not(.after-min-amp-spacer) td:first-child{grid-column:1/-1!important;min-height:48px!important;border-bottom:1px solid #d5dbe4!important;font-size:17px!important;font-weight:800!important;line-height:1.25!important;padding:12px 14px!important;white-space:normal!important;overflow:visible!important}
  tbody tr:not(.section):not(.subtotal):not(.total):not(.after-min-amp-spacer) td:nth-child(2){grid-column:1!important;border-right:1px solid #d5dbe4!important}
  tbody tr:not(.section):not(.subtotal):not(.total):not(.after-min-amp-spacer) td:nth-child(3){grid-column:2!important}
  tbody tr:not(.section):not(.subtotal):not(.total):not(.after-min-amp-spacer) td:nth-child(4),tbody tr:not(.section):not(.subtotal):not(.total):not(.after-min-amp-spacer) td:nth-child(6){display:none!important}
  tbody tr:not(.section):not(.subtotal):not(.total):not(.after-min-amp-spacer) td:nth-child(5){grid-column:1/-1!important;min-height:52px!important;border-top:1px solid #d5dbe4!important;justify-content:flex-start!important;gap:10px!important;padding:9px 14px!important}
  input[type=number],select{height:44px!important;min-width:0!important;width:100%!important;padding:7px 9px!important;font-size:16px!important;text-align:center!important;border:1px solid #93a0b2!important;border-radius:8px!important;background:#fff!important}
  input::placeholder{color:#334155!important;opacity:1!important;font-size:14px!important;font-weight:800!important}
  .descInput{width:100%!important;min-height:42px!important;font-size:16px!important;line-height:1.2!important;padding:8px 9px!important;text-align:left!important}
  .check-wrap{display:flex!important;align-items:center!important;gap:8px!important;max-width:none!important}
  .check{width:38px!important;height:38px!important;flex:0 0 38px!important;font-size:23px!important}
  .managed-qty{min-width:38px!important;height:38px!important;font-size:15px!important}
  #row5,#row6,#row7{grid-template-columns:1fr!important}
  #row5 td:nth-child(2),#row6 td:nth-child(2),#row7 td:nth-child(2){grid-column:1!important;border-right:0!important}
  #row5 td:nth-child(3),#row6 td:nth-child(3),#row7 td:nth-child(3),#row5 td:nth-child(5),#row6 td:nth-child(5),#row7 td:nth-child(5){display:none!important}
  .subtotal,.total{display:grid!important;grid-template-columns:1fr 110px 110px!important;width:100%!important;margin:0 0 10px!important;border-radius:9px!important;overflow:hidden!important}
  .subtotal td,.total td{display:none!important;height:auto!important;min-height:43px!important;padding:8px!important;border:0!important;font-size:12px!important}
  .subtotal td:first-child,.total td:first-child,.subtotal td:nth-child(4),.total td:nth-child(4),.subtotal td:nth-child(6),.total td:nth-child(6){display:flex!important;align-items:center!important}
  .subtotal td:nth-child(4),.subtotal td:nth-child(6),.total td:nth-child(4),.total td:nth-child(6){justify-content:flex-end!important}
  .after-min-amp-spacer{display:none!important}
}
`;

  function applyMobile(){
    attempts++;
    try{
      const doc=frame.contentDocument;
      if(!doc || !doc.head || !doc.getElementById('tbody')) throw new Error('Calculator table not ready');
      if(!doc.getElementById('mobileStagingStyles')){
        const style=doc.createElement('style');
        style.id='mobileStagingStyles';
        style.textContent=mobileCSS;
        doc.head.appendChild(style);
      }
      for(const r of (doc.defaultView.DATA?.inputRows || [])){
        if(r===46) continue;
        const q=doc.getElementById('q'+r);
        const v=doc.getElementById('v'+r);
        if(q && !q.readOnly) q.placeholder=(r===5?'Square Footage':'QTY');
        if(v && !v.readOnly) v.placeholder=(r===43?'Nameplate VA':'VA');
      }
      return true;
    }catch(e){
      if(attempts<240) setTimeout(applyMobile,500);
      return false;
    }
  }

  frame.addEventListener('load',function(){
    status.classList.add('hidden');
    attempts=0;
    setTimeout(applyMobile,300);
  });

  setTimeout(function(){status.classList.add('hidden');},4000);
})();
</script>
</body>
</html>
