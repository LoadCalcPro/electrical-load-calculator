<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Optional Method Calculator</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,Helvetica,sans-serif}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#1e3a8a,#0f172a)}.loading-card{width:100%;max-width:520px;background:#fff;border:1px solid #d1d5db;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.32);padding:28px;text-align:center}.loading-card h1{margin:0 0 8px;color:#1e3a8a;font-size:24px}.loading-card p{margin:0;color:#4b5563;line-height:1.5}.error{color:#b42318!important;font-weight:700;margin-top:12px!important}
</style>
</head>
<body>
<div class="loading"><div class="loading-card"><h1>LoadCalcPro</h1><p>Opening phone staging calculator…</p><p id="loadError" class="error"></p></div></div>
<script>
(async function(){
  const previousStagingUrl = "https://raw.githubusercontent.com/LoadCalcPro/electrical-load-calculator/4eedf5dc797ba9c29e839bd3c5699e62deb46e80/generator-optional-method.html";
  const errorEl = document.getElementById("loadError");
  try{
    const response = await fetch(previousStagingUrl, {cache:"no-store"});
    if(!response.ok) throw new Error("Phone staging source could not be loaded.");
    let wrapper = await response.text();

    const marker = "    document.open();\n    document.write(source);";
    const patch = `    source = replaceRequired(
      source,
      \`function syncManagedControl(r){
  const checkEl = document.getElementById("m"+r);
  const qtyEl = document.getElementById("mq"+r);
  if(!checkEl || !qtyEl) return;
  const total = totalUnits(r);
  let selected = checked(r) ? managedQty(r) : 0;
  if(selected < 1 || total < 1){
    checkEl.classList.remove("checked");
    checkEl.textContent = "";
    qtyEl.classList.remove("show");
    qtyEl.textContent = "";
    qtyEl.dataset.qty = "0";
    return;
  }
  checkEl.classList.add("checked");
  checkEl.textContent = "✓";
  qtyEl.classList.add("show");
  qtyEl.textContent = String(selected);
}\`,
      \`function syncManagedControl(r){
  const checkEl = document.getElementById("m"+r);
  const qtyEl = document.getElementById("mq"+r);
  if(!checkEl || !qtyEl) return;
  const total = totalUnits(r);
  let selected = checked(r) ? managedQty(r) : 0;
  if(selected < 1 || total < 1){
    checkEl.classList.remove("checked");
    checkEl.textContent = "";
    qtyEl.classList.remove("show");
    qtyEl.textContent = "";
    qtyEl.dataset.qty = "0";
    return;
  }
  checkEl.classList.add("checked");
  if(r===41){
    checkEl.textContent = String(selected);
    qtyEl.classList.remove("show");
    qtyEl.textContent = "";
  } else {
    checkEl.textContent = "✓";
    qtyEl.classList.add("show");
    qtyEl.textContent = String(selected);
  }
}\`,
      "single 40 percent managed control"
    );

    source = replaceRequired(
      source,
      'document.getElementById("q41out").textContent = heatQty >= 4 ? heatQty : "";',
      'document.getElementById("q41out").textContent = "";',
      "remove duplicate 40 percent quantity display"
    );

    document.open();
    document.write(source);`;

    if(!wrapper.includes(marker)) throw new Error("Phone staging update marker was not found.");
    wrapper = wrapper.replace(marker, patch);
    document.open();
    document.write(wrapper);
    document.close();
  }catch(error){
    console.error(error);
    if(errorEl) errorEl.textContent = "The phone staging calculator could not be opened. Please refresh the page.";
  }
})();
</script>
</body>
</html>
