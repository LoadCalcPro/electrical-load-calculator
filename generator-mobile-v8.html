<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Load Calc Pro X - Generator Mobile Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#1e3a8a,#0f172a)}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:520px;background:#fff;border:1px solid #d1d5db;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.32);padding:28px;text-align:center}.card h1{margin:0 0 10px;color:#1e3a8a;font-size:28px}.card p{margin:0;color:#4b5563;line-height:1.5}.error{margin-top:14px!important;color:#b42318!important;font-weight:700}
</style>
</head>
<body>
<div class="loading"><div class="card"><h1>Load Calc Pro X</h1><p>Opening Generator Optional Method Calculator…</p><p id="error" class="error"></p></div></div>
<script>
(async function(){
  const errorEl=document.getElementById('error');
  try{
    const url='https://api.github.com/repos/LoadCalcPro/electrical-load-calculator/contents/generator-mobile-staging.html?ref=main&t='+Date.now();
    const response=await fetch(url,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});
    if(!response.ok) throw new Error('GitHub returned '+response.status);
    const data=await response.json();
    if(!data.content) throw new Error('Calculator content was empty');
    const binary=atob(data.content.replace(/\s/g,''));
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const source=new TextDecoder('utf-8').decode(bytes)
      .replaceAll('LoadCalcPro','Load Calc Pro X')
      .replaceAll('Load Calc Pro Professional Membership','Load Calc Pro X Professional Membership');
    document.open();
    document.write(source);
    document.close();
  }catch(error){
    console.error(error);
    errorEl.textContent='The calculator could not open: '+error.message;
  }
})();
</script>
</body>
</html>
