name: Promote current LoadCalcPro X production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-current-production.yml'

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          path: production
          fetch-depth: 0

      - name: Checkout approved staging source
        uses: actions/checkout@v4
        with:
          repository: LoadCalcPro/electrical-load-calculator-staging
          ref: main
          path: staging
          fetch-depth: 1

      - name: Promote current files and convert staging references
        shell: bash
        run: |
          set -euo pipefail
          cd production

          cp ../staging/index.html index.html
          cp ../staging/shop.html shop.html
          cp ../staging/contact.html contact.html
          cp ../staging/privacy.html privacy.html
          cp ../staging/terms.html terms.html
          cp ../staging/brand.css brand.css
          cp ../staging/aic_calculator.html aic_calculator.html
          cp ../staging/staging-member-dashboard.html member-dashboard.html
          cp ../staging/staging-create-password.html create-password.html
          cp ../staging/staging-forgot-password.html forgot-password.html

          rm -rf generator
          cp -R ../staging/generator generator
          rm -f generator/heatpump-independent-answers-fix.js

          python3 - <<'PY'
          from pathlib import Path

          PROD_SUPABASE_URL = 'https://oaqehddiqtgplxydxbxv.supabase.co'
          PROD_SUPABASE_KEY = 'sb_publishable_o_3xMc9QOsgV-8kqBFkLnw_tuvUyWD8'
          PROD_API = 'https://loadcalcpro-hcml-api.onrender.com'

          def edit(path, replacements=(), remove_noindex=False):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              if remove_noindex:
                  text = text.replace('<meta name="robots" content="noindex,nofollow">\n', '')
                  text = text.replace('  <meta name="robots" content="noindex,nofollow">\n', '')
              p.write_text(text, encoding='utf-8')

          public = ['index.html','shop.html','contact.html','privacy.html','terms.html']
          for f in public:
              edit(f, [('staging-member-dashboard.html','member-dashboard.html')], remove_noindex=True)

          dashboard_replacements = [
              ('staging-forgot-password.html','forgot-password.html'),
              ('staging-create-password.html','create-password.html'),
              ('https://jvnkncpljuaeycwjyeai.supabase.co', PROD_SUPABASE_URL),
              ('sb_publishable_aMerqRsuagFjUU67WWmspA_2uDtn4CF', PROD_SUPABASE_KEY),
              ('https://loadcalcpro-hcml-api-staging.onrender.com', PROD_API),
              ('https://loadcalcpro-x-staging.onrender.com/', ''),
              ('loadCalcProStagingRememberedEmail','loadcalcproRememberedEmail'),
          ]
          edit('member-dashboard.html', dashboard_replacements)

          auth_replacements = [
              ('staging-member-dashboard.html','member-dashboard.html'),
              ('staging-create-password.html','create-password.html'),
              ('https://jvnkncpljuaeycwjyeai.supabase.co', PROD_SUPABASE_URL),
              ('sb_publishable_aMerqRsuagFjUU67WWmspA_2uDtn4CF', PROD_SUPABASE_KEY),
              ('https://loadcalcpro-hcml-api-staging.onrender.com', PROD_API),
          ]
          edit('create-password.html', auth_replacements)
          edit('forgot-password.html', auth_replacements)

          edit('generator/index.html', [('../staging-member-dashboard.html','../member-dashboard.html')])
          edit('aic_calculator.html', [
              ('staging-member-dashboard.html','member-dashboard.html'),
              ('https://jvnkncpljuaeycwjyeai.supabase.co', PROD_SUPABASE_URL),
              ('sb_publishable_aMerqRsuagFjUU67WWmspA_2uDtn4CF', PROD_SUPABASE_KEY),
              ('https://loadcalcpro-hcml-api-staging.onrender.com', PROD_API),
              ('https://loadcalcpro-x-staging.onrender.com/', ''),
          ])

          redirects = {
              'generator.html':'generator/',
              'generator-optional-method.html':'generator/',
              'optional-method-generator.html':'generator/',
              'calculator.html':'shop.html#calculators',
              'aic-calculator.html':'aic_calculator.html',
              'electrical-calculation-suite.html':'shop.html#plans',
              'member-access-loadcalcpro-nec2023-v1.0.html':'member-dashboard.html',
              'first-time-access.html':'member-dashboard.html',
          }
          template = '''<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta http-equiv="refresh" content="0;url={target}"><title>LoadCalcPro X</title></head><body><p>Opening the current LoadCalcPro X page…</p><p><a href="{target}">Continue</a></p><script>location.replace({js_target});</script></body></html>'''
          import json
          for path, target in redirects.items():
              Path(path).write_text(template.format(target=target, js_target=json.dumps(target)), encoding='utf-8')

          Path('sitemap.xml').write_text('''<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://loadcalcpro.github.io/electrical-load-calculator/</loc><lastmod>2026-08-12</lastmod></url>\n  <url><loc>https://loadcalcpro.github.io/electrical-load-calculator/shop.html</loc><lastmod>2026-08-12</lastmod></url>\n  <url><loc>https://loadcalcpro.github.io/electrical-load-calculator/contact.html</loc><lastmod>2026-08-12</lastmod></url>\n  <url><loc>https://loadcalcpro.github.io/electrical-load-calculator/privacy.html</loc><lastmod>2026-08-12</lastmod></url>\n  <url><loc>https://loadcalcpro.github.io/electrical-load-calculator/terms.html</loc><lastmod>2026-08-12</lastmod></url>\n</urlset>\n''', encoding='utf-8')
          PY

          rm -f generator-managed-quantity-test.html
          rm -f .github/workflows/promote-current-production.yml

      - name: Validate production release
        shell: bash
        run: |
          set -euo pipefail
          cd production
          test -f generator/index.html
          test -f generator/script.js
          test -f generator/styles.css
          test -f generator/mobile-managed-46.css
          test -f generator/cooling-managed-fix.js
          test -f member-dashboard.html
          test -f aic_calculator.html
          ! grep -R -n --exclude-dir=.git --exclude='*.md' 'loadcalcpro-hcml-api-staging\|loadcalcpro-x-staging.onrender.com\|jvnkncpljuaeycwjyeai.supabase.co\|staging-member-dashboard.html\|staging-create-password.html\|staging-forgot-password.html' .
          ! test -f generator-managed-quantity-test.html
          grep -q 'loadcalcpro-hcml-api.onrender.com' member-dashboard.html
          grep -q 'oaqehddiqtgplxydxbxv.supabase.co' member-dashboard.html
          grep -q 'payhip.com/order?link=AG1mf' shop.html
          grep -q 'payhip.com/order?link=oJZL3' shop.html
          grep -q 'payhip.com/order?link=UOfih' shop.html
          grep -q 'generator/' member-dashboard.html

      - name: Commit production release
        shell: bash
        run: |
          set -euo pipefail
          cd production
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote current LoadCalcPro X site to production'
          git push origin main
